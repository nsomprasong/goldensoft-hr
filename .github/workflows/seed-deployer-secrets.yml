# One-shot: copy VPS deploy secrets onto private goldensoft-deployer.
# Requires GHCR_TOKEN to be a PAT that can administer nsomprasong/goldensoft-deployer.
# Delete this workflow after secrets exist on goldensoft-deployer.
name: Seed deployer secrets

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Copy VPS secrets to goldensoft-deployer
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
          GHCR_TOKEN_VAL: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set VPS_HOST -R nsomprasong/goldensoft-deployer --body "$VPS_HOST"
          gh secret set VPS_USER -R nsomprasong/goldensoft-deployer --body "$VPS_USER"
          gh secret set VPS_COMPOSE_DIR -R nsomprasong/goldensoft-deployer --body "$VPS_COMPOSE_DIR"
          gh secret set VPS_SSH_KEY -R nsomprasong/goldensoft-deployer --body "$VPS_SSH_KEY"
          gh secret set GHCR_TOKEN -R nsomprasong/goldensoft-deployer --body "$GHCR_TOKEN_VAL"
          echo "Seeded VPS_* + GHCR_TOKEN onto goldensoft-deployer"
